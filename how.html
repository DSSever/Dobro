<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Как это работает — Вода Добра</title>
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<script src="menu.js"></script>

<section class="hero" style="padding:80px 20px;">
  <h1>Как работает помощь</h1>
  <p>Простой и прозрачный механизм — 3 шага</p>
</section>

<section class="section">
  <div class="steps">
    <div class="step">
      <h3>1. Выберите получателя</h3>
      <p>Приют, семью или НКО в вашем городе</p>
    </div>
    <div class="step">
      <h3>2. Укажите сумму</h3>
      <p>От 100 ₽ — любая помощь важна</p>
    </div>
    <div class="step">
      <h3>3. Оплатите онлайн</h3>
      <p>Деньги идут напрямую водоканалу — чек сразу</p>
    </div>
  </div>
</section>

<script>
// Гамбургер меню
document.getElementById('menuToggle').addEventListener('click', function() {
  const nav = document.getElementById('mainNav');
  nav.classList.toggle('active');
});

// Закрыть меню при клике на ссылку
document.querySelectorAll('#mainNav a').forEach(link => {
  link.addEventListener('click', function() {
    document.getElementById('mainNav').classList.remove('active');
  });
});

// Закрыть меню при клике вне его
document.addEventListener('click', function(event) {
  const nav = document.getElementById('mainNav');
  const toggle = document.getElementById('menuToggle');
  if (!nav.contains(event.target) && !toggle.contains(event.target)) {
    nav.classList.remove('active');
  }
});
</script>

</body>
</html>
